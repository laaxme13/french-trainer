<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🇫🇷 Тренажёр</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
            background: #f7f9fc;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            margin: 0;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            border-radius: 32px;
            padding: 24px 20px 32px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.08);
            transition: 0.2s;
        }
        h1 {
            font-size: 24px;
            font-weight: 600;
            color: #1e293b;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }
        .subhead {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 20px;
            border-bottom: 1px solid #e9edf2;
            padding-bottom: 16px;
        }
        .mode-switch {
            display: flex;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
        .mode-btn {
            flex: 1;
            min-width: 80px;
            padding: 10px 0;
            border: 1px solid #dce0e6;
            background: white;
            border-radius: 40px;
            font-weight: 500;
            font-size: 15px;
            color: #334155;
            cursor: pointer;
            transition: 0.15s;
            text-align: center;
        }
        .mode-btn.active {
            background: #1e293b;
            border-color: #1e293b;
            color: white;
        }
        .mode-btn:active { transform: scale(0.96); }
        .sentence-card {
            background: #f1f5f9;
            border-radius: 24px;
            padding: 28px 20px;
            margin-bottom: 20px;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            line-height: 1.6;
            color: #0f172a;
            text-align: center;
            word-break: break-word;
        }
        .sentence-card .blank {
            display: inline-block;
            min-width: 80px;
            border-bottom: 3px dashed #3b82f6;
            margin: 0 4px;
            color: #1e293b;
            font-weight: 600;
        }
        .input-area {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .input-area input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #dce0e6;
            border-radius: 60px;
            font-size: 18px;
            outline: none;
            background: white;
            transition: 0.15s;
        }
        .input-area input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }
        .input-area button {
            padding: 14px 24px;
            background: #1e293b;
            color: white;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: 0.15s;
            white-space: nowrap;
        }
        .input-area button:active { transform: scale(0.95); }
        .input-area button:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        .feedback {
            min-height: 48px;
            padding: 12px 16px;
            border-radius: 16px;
            margin-bottom: 16px;
            font-size: 15px;
            line-height: 1.5;
            background: #f8fafc;
            color: #0f172a;
            border-left: 4px solid #94a3b8;
        }
        .feedback.correct {
            border-left-color: #22c55e;
            background: #f0fdf4;
        }
        .feedback.wrong {
            border-left-color: #ef4444;
            background: #fef2f2;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            font-size: 15px;
            color: #475569;
            padding: 12px 4px 0;
            border-top: 1px solid #e9edf2;
            margin-top: 8px;
        }
        .stats span { font-weight: 600; }
        .stats .correct-count { color: #22c55e; }
        .stats .wrong-count { color: #ef4444; }
        .next-btn {
            width: 100%;
            padding: 16px;
            background: #e9edf2;
            border: none;
            border-radius: 60px;
            font-weight: 600;
            font-size: 17px;
            color: #1e293b;
            margin-top: 12px;
            cursor: pointer;
            transition: 0.15s;
        }
        .next-btn:active { transform: scale(0.97); }
        .next-btn:disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        .repeat-toggle {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0 8px;
            font-size: 14px;
            color: #475569;
        }
        .repeat-toggle input {
            width: 20px;
            height: 20px;
            accent-color: #1e293b;
            cursor: pointer;
        }
        .error-msg {
            color: #ef4444;
            font-size: 14px;
            text-align: center;
            margin-top: 8px;
        }
        @media (max-width: 480px) {
            .container { padding: 16px; }
            .sentence-card { font-size: 19px; padding: 20px 12px; }
            .input-area input { font-size: 16px; padding: 12px 14px; }
            .input-area button { padding: 12px 18px; font-size: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🇫🇷 Тренажёр</h1>
    <div class="subhead">Артикли и предлоги · вперемешку</div>

    <div class="mode-switch">
        <button class="mode-btn active" data-mode="all">Вперемешку</button>
        <button class="mode-btn" data-mode="prep">Предлоги</button>
        <button class="mode-btn" data-mode="art">Артикли</button>
    </div>

    <div class="sentence-card" id="sentenceDisplay">
        <span>Нажмите «Далее»</span>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Введите ответ..." autocomplete="off" />
        <button id="checkBtn">Проверить</button>
    </div>

    <div class="feedback" id="feedback">Введите ответ и нажмите «Проверить»</div>

    <div class="stats">
        <span>✅ Верно: <span class="correct-count" id="correctCount">0</span></span>
        <span>❌ Ошибок: <span class="wrong-count" id="wrongCount">0</span></span>
        <span>📌 Очередь: <span id="queueCount">0</span></span>
    </div>

    <div class="repeat-toggle">
        <input type="checkbox" id="repeatMode" />
        <label for="repeatMode">🔄 Повтор ошибочных (каждые 10)</label>
    </div>

    <button class="next-btn" id="nextBtn">Далее →</button>
    <div id="errorMsg" class="error-msg"></div>
</div>

<script>
    (function() {
        // ---------- API КОНФИГ ----------
        const GEMINI_KEY = 'AQ.Ab8RN6KEgEzZDxnRf3AJkSV3GToj5rSdztgmH_nQPNQwXxpOUw';
        const GEMINI_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`;
        const PROXY_URL = `https://corsproxy.io/?url=${encodeURIComponent(GEMINI_URL)}`;

        // ---------- СОСТОЯНИЕ ----------
        let sentences = [];
        let currentIndex = 0;
        let correctCount = 0;
        let wrongCount = 0;
        let wrongList = [];
        let currentMode = 'all'; // 'all' | 'prep' | 'art'
        let repeatMode = false;
        let isChecking = false;
        let isGenerating = false;
        let currentSentence = null; // { text, answer, type, explanation? }

        // DOM-элементы
        const sentenceDisplay = document.getElementById('sentenceDisplay');
        const userInput = document.getElementById('userInput');
        const checkBtn = document.getElementById('checkBtn');
        const feedback = document.getElementById('feedback');
        const correctSpan = document.getElementById('correctCount');
        const wrongSpan = document.getElementById('wrongCount');
        const queueSpan = document.getElementById('queueCount');
        const nextBtn = document.getElementById('nextBtn');
        const errorMsg = document.getElementById('errorMsg');
        const repeatCheckbox = document.getElementById('repeatMode');
        const modeBtns = document.querySelectorAll('.mode-btn');

        // ---------- ВСПОМОГАТЕЛЬНЫЕ ----------
        function updateStats() {
            correctSpan.textContent = correctCount;
            wrongSpan.textContent = wrongCount;
            queueSpan.textContent = wrongList.length;
        }

        function setError(msg) {
            errorMsg.textContent = msg;
            if (msg) console.warn(msg);
        }

        function setFeedback(text, type = '') {
            feedback.textContent = text;
            feedback.className = 'feedback' + (type ? ' ' + type : '');
        }

        function setButtonsEnabled(enabled) {
            checkBtn.disabled = !enabled;
            nextBtn.disabled = !enabled;
        }

        function renderSentence(sentence) {
            if (!sentence) {
                sentenceDisplay.innerHTML = '<span>Нет предложений. Нажмите «Далее»</span>';
                return;
            }
            // Показываем текст с подчёркиванием вместо пропуска
            const parts = sentence.text.split('___');
            if (parts.length === 2) {
                sentenceDisplay.innerHTML = `
                    ${parts[0]}<span class="blank">______</span>${parts[1]}
                `;
            } else {
                sentenceDisplay.innerHTML = sentence.text;
            }
            userInput.value = '';
            userInput.focus();
            setFeedback('Введите ответ и нажмите «Проверить»');
        }

        // ---------- ГЕНЕРАЦИЯ ПРЕДЛОЖЕНИЙ (Gemini) ----------
        async function generateSentences(mode, count = 10) {
            if (isGenerating) return;
            isGenerating = true;
            setButtonsEnabled(false);
            setError('');
            setFeedback('⏳ Генерация предложений...', '');

            const modeMap = {
                'all': 'артикли (le/la/les/un/une/des) и предлоги (à/au/aux/du/de/des/en/par/pour/sans/sous/sur/avec/chez/entre)',
                'prep': 'только предлоги (à/au/aux/du/de/des/en/par/pour/sans/sous/sur/avec/chez/entre)',
                'art': 'только артикли (le/la/les/un/une/des)'
            };
            const modeDesc = modeMap[mode] || modeMap['all'];

            const prompt = `
                Ты — генератор упражнений для изучения французского языка.
                Сгенерируй ${count} предложений на французском языке с пропуском (___).
                Тема: ${modeDesc}.
                Каждое предложение должно иметь ровно один пропуск.
                Для каждого предложения укажи правильный ответ (то, что должно стоять на месте пропуска) и тип (артикль или предлог).
                Верни ответ строго в формате JSON-массива объектов с полями:
                {
                    "text": "предложение с ___ вместо пропуска",
                    "answer": "правильный ответ",
                    "type": "article" или "preposition"
                }
                Только JSON, без пояснений.
                Пример: [{"text":"Je vais ___ école.","answer":"à l'","type":"preposition"}]
            `;

            try {
                const response = await fetch(PROXY_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: prompt }]
                        }]
                    })
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`API ошибка ${response.status}: ${errText}`);
                }

                const data = await response.json();
                const rawText = data?.candidates?.[0]?.content?.parts?.[0]?.text || '';

                // Извлекаем JSON из ответа
                const jsonMatch = rawText.match(/\[[\s\S]*\]/);
                if (!jsonMatch) throw new Error('Не удалось найти JSON в ответе');
                const parsed = JSON.parse(jsonMatch[0]);
                if (!Array.isArray(parsed) || parsed.length === 0) throw new Error('Пустой массив');

                // Сохраняем
                sentences = parsed.map(s => ({
                    text: s.text || '',
                    answer: (s.answer || '').trim(),
                    type: s.type === 'article' ? 'article' : 'preposition',
                    explanation: s.explanation || ''
                }));

                if (sentences.length === 0) throw new Error('Нет сгенерированных предложений');

                currentIndex = 0;
                wrongList = [];
                correctCount = 0;
                wrongCount = 0;
                updateStats();
                currentSentence = sentences[0];
                renderSentence(currentSentence);
                setFeedback(`✅ Загружено ${sentences.length} предложений. Введите ответ.`, 'correct');
                setError('');
            } catch (err) {
                setError('Ошибка генерации: ' + err.message);
                setFeedback('⚠️ Не удалось загрузить упражнения. Нажмите «Далее» для повтора.', 'wrong');
                // Если нет предложений, показываем заглушку
                if (sentences.length === 0) {
                    sentences = [{
                        text: 'Je vais ___ école.',
                        answer: "à l'",
                        type: 'preposition'
                    }];
                    currentIndex = 0;
                    currentSentence = sentences[0];
                    renderSentence(currentSentence);
                }
            } finally {
                isGenerating = false;
                setButtonsEnabled(true);
            }
        }

        // ---------- ПРОВЕРКА ОТВЕТА ----------
        function checkAnswer() {
            if (isChecking || !currentSentence) return;
            if (!userInput.value.trim()) {
                setFeedback('✏️ Введите ваш вариант ответа.', '');
                return;
            }

            isChecking = true;
            const userAnswer = userInput.value.trim();
            const correctAnswer = currentSentence.answer;

            // Нормализация для сравнения (убираем пробелы, приводим к нижнему регистру)
            const normalize = (s) => s.replace(/\s+/g, ' ').trim().toLowerCase();
            const isCorrect = normalize(userAnswer) === normalize(correctAnswer);

            if (isCorrect) {
                correctCount++;
                setFeedback(`✅ Верно! Правильный ответ: «${correctAnswer}»`, 'correct');
            } else {
                wrongCount++;
                // Добавляем в список ошибочных (если повтор включён)
                if (repeatMode) {
                    // Проверяем, нет ли уже такого в списке (чтобы не дублировать)
                    const exists = wrongList.some(s => s.text === currentSentence.text);
                    if (!exists) {
                        wrongList.push({ ...currentSentence });
                    }
                }
                const explanation = currentSentence.explanation ? ` (${currentSentence.explanation})` : '';
                setFeedback(`❌ Неверно. Правильно: «${correctAnswer}»${explanation}`, 'wrong');
            }

            updateStats();
            userInput.disabled = true;
            checkBtn.disabled = true;
            isChecking = false;
        }

        // ---------- СЛЕДУЮЩЕЕ ПРЕДЛОЖЕНИЕ ----------
        function nextSentence() {
            if (isGenerating) return;

            // Если есть повторяемые ошибки и включён режим
            if (repeatMode && wrongList.length > 0) {
                // Берём первое из списка ошибок
                const next = wrongList.shift();
                // Вставляем его в массив на позицию currentIndex
                sentences.splice(currentIndex + 1, 0, next);
                // Если currentIndex указывает на последний элемент, двигаем его
                if (currentIndex >= sentences.length - 1) {
                    // ничего не делаем, просто перейдём к следующему
                }
            }

            // Переход к следующему индексу
            if (currentIndex < sentences.length - 1) {
                currentIndex++;
            } else {
                // Если дошли до конца — запрашиваем новую порцию
                setFeedback('📚 Загружаем новую порцию...', '');
                generateSentences(currentMode, 10);
                return;
            }

            currentSentence = sentences[currentIndex];
            renderSentence(currentSentence);
            userInput.disabled = false;
            checkBtn.disabled = false;
            userInput.focus();
            setFeedback('Введите ответ и нажмите «Проверить»');
            updateStats();
        }

        // ---------- ОБРАБОТЧИКИ ----------
        checkBtn.addEventListener('click', checkAnswer);

        nextBtn.addEventListener('click', nextSentence);

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                if (!checkBtn.disabled) {
                    checkAnswer();
                } else if (!nextBtn.disabled) {
                    nextSentence();
                }
            }
        });

        // Переключение режима
        modeBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                modeBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
                // Сбрасываем и генерируем заново
                generateSentences(currentMode, 10);
            });
        });

        // Повтор ошибок
        repeatCheckbox.addEventListener('change', () => {
            repeatMode = repeatCheckbox.checked;
            if (!repeatMode) {
                // Очищаем список ошибок
                wrongList = [];
                updateStats();
            }
        });

        // ---------- ИНИЦИАЛИЗАЦИЯ ----------
        function init() {
            // Загружаем начальные предложения
            generateSentences('all', 10);
        }

        init();
    })();
</script>
</body>
</html>
